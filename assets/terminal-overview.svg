<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mac Terminal Upgrade: una Terminal de macOS moderna, clara y asistida por IA</title>
  <desc id="desc">Vista del perfil oscuro Focus, comandos eza con colores, IA inline, navegación zoxide, sesiones tmux, fzf, sugerencias y backups recuperables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset="0.58" stop-color="#0b131d"/>
      <stop offset="1" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7dd3fc" stroke-opacity=".045"/>
    </pattern>
    <style>
      .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
      .sans{font-family:"Avenir Next","Helvetica Neue",sans-serif}
      .label{font-size:18px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
      .terminal{font-size:22px}
      .small{font-size:17px}
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="900" rx="32" fill="url(#grid)"/>
  <circle cx="1475" cy="-12" r="245" fill="#67e8f9" opacity=".06"/>
  <circle cx="88" cy="850" r="270" fill="#fb7185" opacity=".055"/>

  <g class="sans">
    <text x="78" y="82" class="label" fill="#67e8f9">MAC TERMINAL UPGRADE</text>
    <text x="78" y="142" font-size="48" font-weight="750" fill="#f8fafc">Tu Terminal. Menos ruido. Más capacidad.</text>
    <text x="80" y="184" font-size="21" fill="#94a3b8">Zsh nativo · herramientas modernas · IA inline · instalación recuperable</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="236" width="980" height="574" rx="24" fill="#090e14" stroke="#334155" stroke-width="2"/>
    <path d="M78 294h980" stroke="#263241" stroke-width="2"/>
    <circle cx="116" cy="265" r="10" fill="#ff5f57"/>
    <circle cx="150" cy="265" r="10" fill="#febc2e"/>
    <circle cx="184" cy="265" r="10" fill="#28c840"/>
    <text x="222" y="273" class="mono small" fill="#8b9aab">📁 Mac Terminal Upgrade — Focus</text>

    <g class="mono terminal">
      <text x="116" y="348" fill="#e2e8f0">rootml@mac</text>
      <text x="272" y="348" fill="#64748b">~/proyecto</text>
      <text x="430" y="348" fill="#7dd3fc">%</text>
      <text x="460" y="348" fill="#f8fafc">ll</text>

      <text x="116" y="394" fill="#64748b">drwxr-xr-x</text>
      <text x="304" y="394" fill="#7dd3fc">▰ src</text>
      <text x="560" y="394" fill="#a7f3d0">main</text>
      <text x="706" y="394" fill="#64748b">hace 2 min</text>
      <text x="116" y="434" fill="#64748b">-rw-r--r--</text>
      <text x="304" y="434" fill="#fda4af">◆ README.md</text>
      <text x="560" y="434" fill="#fde68a">M</text>
      <text x="706" y="434" fill="#64748b">4.2 KB</text>
      <text x="116" y="474" fill="#64748b">-rwxr-xr-x</text>
      <text x="304" y="474" fill="#a7f3d0">⚙ install.sh</text>
      <text x="560" y="474" fill="#a7f3d0">✓</text>
      <text x="706" y="474" fill="#64748b">8.8 KB</text>

      <path d="M116 516h864" stroke="#1e293b"/>
      <text x="116" y="561" fill="#e2e8f0">rootml@mac</text>
      <text x="272" y="561" fill="#64748b">~/proyecto</text>
      <text x="430" y="561" fill="#7dd3fc">%</text>
      <text x="460" y="561" fill="#94a3b8"># encuentra los 10 elementos más grandes</text>
      <rect x="112" y="587" width="822" height="52" rx="10" fill="#0f1b27" stroke="#164e63"/>
      <text x="136" y="621" fill="#67e8f9">IA →</text>
      <text x="220" y="621" fill="#f8fafc">du -ah . | sort -hr | head</text>
      <text x="116" y="677" class="small" fill="#64748b">Revisa el comando · segundo Enter para ejecutarlo</text>

      <text x="116" y="731" fill="#e2e8f0">rootml@mac</text>
      <text x="272" y="731" fill="#64748b">~</text>
      <text x="430" y="731" fill="#7dd3fc">%</text>
      <text x="460" y="731" fill="#f8fafc">z proyecto</text>
      <text x="655" y="731" fill="#475569">→</text>
      <text x="695" y="731" fill="#a7f3d0">~/Projects/proyecto</text>

      <text x="116" y="775" fill="#e2e8f0">rootml@mac</text>
      <text x="272" y="775" fill="#64748b">~/Projects/proyecto</text>
      <text x="512" y="775" fill="#7dd3fc">%</text>
      <text x="542" y="775" fill="#f8fafc">work</text>
      <text x="655" y="775" fill="#475569">→</text>
      <text x="695" y="775" fill="#a7f3d0">tmux · sesión persistente</text>
    </g>
  </g>

  <g class="sans" transform="translate(1110 236)">
    <text x="0" y="24" class="label" fill="#94a3b8">LO QUE CAMBIA</text>

    <g transform="translate(0 62)">
      <rect width="412" height="88" rx="16" fill="#111c27" stroke="#203449"/>
      <circle cx="42" cy="44" r="21" fill="#123849"/>
      <text x="42" y="51" text-anchor="middle" font-size="21" fill="#67e8f9">◉</text>
      <text x="78" y="36" font-size="20" font-weight="700" fill="#f8fafc">Lectura instantánea</text>
      <text x="78" y="63" font-size="16" fill="#94a3b8">colores, iconos, permisos y Git</text>
    </g>

    <g transform="translate(0 166)">
      <rect width="412" height="88" rx="16" fill="#111c27" stroke="#203449"/>
      <circle cx="42" cy="44" r="21" fill="#123849"/>
      <text x="42" y="51" text-anchor="middle" font-size="20" fill="#67e8f9">⌘</text>
      <text x="78" y="36" font-size="20" font-weight="700" fill="#f8fafc">Menos memoria mecánica</text>
      <text x="78" y="63" font-size="16" fill="#94a3b8">IA inline, navi y autocompletado</text>
    </g>

    <g transform="translate(0 270)">
      <rect width="412" height="88" rx="16" fill="#111c27" stroke="#203449"/>
      <circle cx="42" cy="44" r="21" fill="#123849"/>
      <text x="42" y="51" text-anchor="middle" font-size="20" fill="#67e8f9">↗</text>
      <text x="78" y="36" font-size="20" font-weight="700" fill="#f8fafc">Flujo continuo</text>
      <text x="78" y="63" font-size="16" fill="#94a3b8">zoxide, fzf y tmux persistente</text>
    </g>

    <g transform="translate(0 374)">
      <rect width="412" height="88" rx="16" fill="#111c27" stroke="#203449"/>
      <circle cx="42" cy="44" r="21" fill="#3b2029"/>
      <text x="42" y="51" text-anchor="middle" font-size="20" fill="#fda4af">✓</text>
      <text x="78" y="36" font-size="20" font-weight="700" fill="#f8fafc">Reversible por diseño</text>
      <text x="78" y="63" font-size="16" fill="#94a3b8">backup, marcadores y desinstalador</text>
    </g>

    <g transform="translate(0 498)">
      <path d="M0 0h412" stroke="#334155"/>
      <text x="0" y="42" class="label" fill="#67e8f9">UN COMANDO</text>
      <text x="0" y="78" class="mono small" fill="#e2e8f0">./install.sh</text>
      <rect x="0" y="104" width="412" height="2" fill="url(#cyan)"/>
    </g>
  </g>

  <text x="80" y="862" class="mono small" fill="#64748b">Terminal.app sigue siendo Terminal.app — solo gana mejores herramientas y una interfaz más calmada.</text>
</svg>
